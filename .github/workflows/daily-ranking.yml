name: Generate daily rankings

on:
  schedule:
    # Generate tomorrow's UTC puzzle ahead of time.
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: UTC puzzle date (YYYY-MM-DD). Defaults to today.
        required: false
        type: string
      force:
        description: Replace an existing R2 ranking for this date.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-ranking-${{ github.event.inputs.target_date || 'scheduled' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET || 'contextai-rankings' }}
      DAILY_WORD_SEED: ${{ secrets.DAILY_WORD_SEED }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4

      - name: Resolve puzzle date and check required secrets
        id: puzzle
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_ACCOUNT_ID" || -z "$CF_R2_ACCESS_KEY_ID" || -z "$CF_R2_SECRET_ACCESS_KEY" || -z "$DAILY_WORD_SEED" ]]; then
            echo "Configure CF_ACCOUNT_ID, CF_R2_ACCESS_KEY_ID, CF_R2_SECRET_ACCESS_KEY, and DAILY_WORD_SEED in repository Actions secrets." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            date_value="${{ inputs.target_date }}"
            date_value="${date_value:-$(date -u +%F)}"
          else
            date_value="$(date -u -d tomorrow +%F)"
          fi
          python -c 'from datetime import date; import sys; date.fromisoformat(sys.argv[1])' "$date_value"
          echo "date=$date_value" >> "$GITHUB_OUTPUT"
          echo "endpoint=https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" >> "$GITHUB_OUTPUT"

      - name: Configure R2 S3 credentials
        if: steps.puzzle.outputs.date != ''
        shell: bash
        run: |
          {
            echo "AWS_ACCESS_KEY_ID=$CF_R2_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$CF_R2_SECRET_ACCESS_KEY"
          } >> "$GITHUB_ENV"

      - name: Skip if the ranking already exists
        id: existing
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force) }}
        shell: bash
        run: |
          if aws s3api head-object \
            --bucket "$CF_R2_BUCKET" \
            --key "rankings/${{ steps.puzzle.outputs.date }}.json" \
            --endpoint-url "${{ steps.puzzle.outputs.endpoint }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Ranking already exists; leaving the published daily puzzle unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache the FastText model
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.gensim-data
          key: gensim-fasttext-wiki-news-subwords-300-v1

      - name: Install ranking dependencies
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Test daily answer selection
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: python -m unittest discover -s tests -v

      - name: Generate ranking
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: python src/precompute_ranking.py --target-date "${{ steps.puzzle.outputs.date }}"

      - name: Publish ranking to private Cloudflare R2
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          aws s3 cp "data/daily/${{ steps.puzzle.outputs.date }}.json" \
            "s3://$CF_R2_BUCKET/rankings/${{ steps.puzzle.outputs.date }}.json" \
            --endpoint-url "${{ steps.puzzle.outputs.endpoint }}" \
            --content-type "application/json" \
            --cache-control "public, max-age=31536000, immutable"
